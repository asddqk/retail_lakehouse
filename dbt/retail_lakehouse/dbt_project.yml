name: retail_lakehouse
version: "1.0.0"
config-version: 2
profile: retail_lakehouse

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Сколько дней назад пересчитывать витрины при инкрементальной загрузке
  lookback_days: 3

models:
  retail_lakehouse:
    +on_table_exists: replace        # Trino: CREATE OR REPLACE TABLE, история снапшотов Iceberg сохраняется
    +properties:
      format: "'PARQUET'"
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    quality:
      +schema: quality
      +materialized: table

snapshots:
  retail_lakehouse:
    +target_schema: snapshots
